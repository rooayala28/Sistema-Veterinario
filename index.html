<title>Sistema Veterinario</title>

<style>

 --bg1:#f4f5f6;--b1:rgba(150,155,162,.45);--b2:rgba(35,162,106,.32);--b3:rgba(90,140,255,.28);--b4:rgba(255,150,200,.25);
}
html[data-theme="dark"]{
 --p:#c0c4cb;--p2:#cfd3d8;--pl:rgba(192,196,203,.18);--g:#4fd497;--gl:rgba(79,212,151,.16);--r:#ff6b60;--rl:rgba(255,107,96,.16);--y:#ffc45a;--yl:rgba(255,196,90,.16);
 --tx:#f4f5f6;--mu:#acadaf;--bd:rgba(255,255,255,.14);--line:rgba(255,255,255,.08);
 --glass:rgba(44,46,48,.48);--glass2:rgba(58,60,62,.7);--field:rgba(255,255,255,.07);
 --hi:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.04);
 --sh:0 12px 34px rgba(0,0,0,.4);
 --bg1:#161718;--b1:rgba(138,144,152,.45);--b2:rgba(30,150,100,.30);--b3:rgba(60,90,220,.30);--b4:rgba(200,60,140,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

 background:radial-gradient(40% 35% at 15% 10%,var(--b1),transparent 70%),radial-gradient(35% 30% at 90% 20%,var(--b3),transparent 70%),radial-gradient(45% 40% at 80% 85%,var(--b2),transparent 70%),radial-gradient(35% 35% at 10% 80%,var(--b4),transparent 70%);filter:blur(10px)}
.glass,.card,header.top,nav.tabs,.toast{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--bd);box-shadow:var(--hi),var(--sh)}
header.top{position:sticky;top:0;z-index:20;border-width:0 0 1px;border-radius:0;padding:max(12px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 12px max(18px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px}
header.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}

main{max-width:1040px;margin:0 auto;padding:18px max(14px,env(safe-area-inset-right)) 110px max(14px,env(safe-area-inset-left))}
.card{border-radius:var(--rad);padding:18px;margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 12px;color:var(--tx);font-weight:800;letter-spacing:-.01em}

.row>.w2{flex:2 1 260px}.row>.w05{flex:.5 1 84px}
label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin:0 0 4px 4px}

select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=date],input[type=datetime-local]{min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 4px var(--pl)}
::placeholder{color:var(--mu);opacity:.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--glass2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--tx);padding:10px 16px;min-height:42px;border-radius:999px;font:inherit;font-weight:650;font-size:14.5px;cursor:pointer;white-space:nowrap;box-shadow:var(--hi),0 2px 8px rgba(80,84,90,.08);transition:transform .12s,box-shadow .2s}
.btn.pri{background:linear-gradient(160deg,var(--p2),var(--p));border-color:rgba(255,255,255,.25);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(114,118,125,.35)}
.btn.gr{background:linear-gradient(160deg,#3cc489,var(--g));border-color:rgba(255,255,255,.25);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(35,162,106,.3)}
.btn.dan{color:var(--r)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13.5px}
.btn:active{transform:scale(.96)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--mu)}.small{font-size:12.5px}
a{color:var(--p)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--bd);background:var(--field);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:var(--hi);transition:.15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--pl);border-color:var(--p2);color:var(--p);font-weight:650}
.list{margin:0 -6px}
.list .it{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:16px;cursor:pointer;transition:.15s}
.list .it+.it{border-top:1px solid var(--line)}
.list .it:hover{background:var(--pl)}
.av{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--pl),var(--gl));color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;border:1px solid var(--bd);box-shadow:var(--hi)}
.tag{display:inline-block;font-size:11px;font-weight:750;padding:3px 9px;border-radius:999px;background:var(--pl);color:var(--p);letter-spacing:.02em}
.tag.g{background:var(--gl);color:var(--g)}.tag.r{background:var(--rl);color:var(--r)}.tag.y{background:var(--yl);color:var(--y)}
.exam{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:900px){.exam{grid-template-columns:1fr 1fr;column-gap:18px}}
.exr{display:grid;grid-template-columns:140px 82px 1fr;gap:8px;align-items:center}
.nab{display:flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;background:var(--field);padding:2px}
.nab span{flex:1;text-align:center;padding:7px 0;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--mu);border-radius:999px;transition:.15s}
.nab span.n.on{background:var(--g);color:#fff}.nab span.a.on{background:var(--r);color:#fff}
.rx{border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:10px;background:var(--field);box-shadow:var(--hi)}
.rx.act{background:var(--gl)}

.rxline.warn{background:var(--yl);border-color:rgba(201,138,18,.3)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid24{display:grid;grid-template-columns:170px repeat(24,minmax(24px,1fr));gap:2px;font-size:11px;min-width:800px}
.grid24 div{padding:4px 2px;text-align:center;min-height:28px;border-radius:7px;background:var(--field)}
.grid24 .hd{background:var(--pl);font-weight:800;color:var(--p)}
.grid24 .nm{text-align:left;font-weight:650;padding-left:8px}
.grid24 .due{background:var(--yl);color:var(--y);cursor:pointer;font-weight:800}
.grid24 .done{background:var(--g);color:#fff;font-weight:800;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);color:var(--tx);padding:12px 20px;border-radius:999px;font-weight:650;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14.5px}
.kv b{color:var(--mu);font-weight:600}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.alert{background:var(--yl);border:1px solid rgba(201,138,18,.3);color:var(--tx);padding:11px 14px;border-radius:16px;font-size:13.5px;margin-bottom:14px;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.sticky{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6}
/* --- autocompletado --- */
#ac{position:absolute;z-index:120;min-width:220px;max-height:310px;overflow:auto;padding:5px;border-radius:18px;background:var(--glass2);-webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);border:1px solid var(--bd);box-shadow:var(--hi),0 14px 40px rgba(47,49,53,.25);animation:acin .2s cubic-bezier(.3,1.3,.5,1);transform-origin:top center}
#ac[hidden]{display:none}
@keyframes acin{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.aci{padding:9px 12px;border-radius:12px;cursor:pointer;font-size:15px;line-height:1.25}
.aci b{color:var(--p)}
.aci small{display:block;color:var(--mu);font-size:12px;margin-top:1px}
.aci.sel,.aci:hover{background:var(--pl)}
.acnew{color:var(--mu);font-size:13px;padding:8px 12px}

.dock{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:12;display:flex;gap:6px;padding:8px;margin:0 0 12px;border-radius:24px;overflow-x:auto;scrollbar-width:none;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--bd);box-shadow:var(--hi),var(--sh)}
.dock::-webkit-scrollbar{display:none}
.bub{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font:inherit;cursor:pointer;padding:2px 4px;color:var(--mu);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bub .bc{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--field);border:1px solid var(--bd);box-shadow:var(--hi);transition:transform .35s cubic-bezier(.3,1.5,.5,1),background .3s}
.bub small{font-size:10.5px;font-weight:700;white-space:nowrap}

.bub.cur .bc{background:linear-gradient(160deg,var(--p2),var(--p));color:#fff;transform:scale(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px rgba(114,118,125,.4)}

@keyframes bpop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.bub svg{width:18px;height:18px}
.wcard{animation:win .45s cubic-bezier(.3,1.15,.5,1)}
.wcard.back{animation:wback .45s cubic-bezier(.3,1.15,.5,1)}
@keyframes win{from{opacity:0;transform:translateX(60px) scale(.98)}}
@keyframes wback{from{opacity:0;transform:translateX(-60px) scale(.98)}}
.ghost{pointer-events:none;transform-origin:center center}
.wnav{display:flex;gap:8px;align-items:center}
.wnav .stp{flex:1;text-align:center;font-size:12.5px;color:var(--mu);font-weight:700}
.hint{font-size:11.5px;color:var(--mu);text-align:center;margin:-4px 0 10px}
@media (min-width:1240px){.dock{position:fixed;left:max(16px,calc(50vw - 520px - 100px));top:110px;flex-direction:column;width:76px;margin:0;overflow:visible}.bub{flex:0 0 auto}}
.pv{display:none;position:fixed;inset:0;z-index:95;overflow:auto;-webkit-overflow-scrolling:touch;background:rgba(34,35,37,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pv.on{display:block;animation:fadein .3s ease}
.pvbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--bd)}
.pvt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.paper{background:#fff;color:#000;width:min(816px,calc(100% - 20px));margin:18px auto 70px;padding:48px 54px;border-radius:6px;box-shadow:0 14px 50px rgba(0,0,0,.28);animation:paperin .5s cubic-bezier(.3,1.2,.5,1)}
@media(max-width:600px){.paper{padding:22px 16px}.pvbar .btn{padding:6px 10px}}
@keyframes fadein{from{opacity:0}}

/* --- tiles de constantes animadas --- */
.vts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.vt{display:flex;flex-direction:column;gap:6px;padding:10px 10px 10px;border-radius:20px;background:var(--field);border:1px solid var(--bd);box-shadow:var(--hi)}
.vt .ic{height:52px;display:flex;align-items:center;justify-content:center}
.vt .ic svg{height:50px;width:50px;overflow:visible}
.vt .lb{font-size:12px;font-weight:750;color:var(--mu);text-align:center;letter-spacing:.02em}
.vt .lb span{font-weight:500;margin-left:3px}
.vt input{text-align:center;font-weight:750;font-size:18px;padding:8px 6px;background:var(--glass2)}
.fx .beat{transform-box:fill-box;transform-origin:50% 62%;animation:lubdub var(--d,1.1s) infinite}
@keyframes lubdub{0%{transform:scale(1)}11%{transform:scale(1.15)}21%{transform:scale(.97)}31%{transform:scale(1.09)}45%{transform:scale(1)}100%{transform:scale(1)}}

@keyframes breathe{0%,100%{transform:scale(1)}45%{transform:scale(1.09,1.13)}}

.fx .bulb{fill:var(--tc,#cccccd);transition:fill .5s}
.fx .press{transform-box:fill-box;transform-origin:50% 50%;animation:crt var(--d,2.4s) ease-out infinite}
@keyframes crt{0%{opacity:.97;transform:scale(1)}8%{opacity:.97}70%{opacity:0;transform:scale(.55)}100%{opacity:0}}
.fx .needle{transform-box:view-box;transform-origin:32px 38px;animation:wob 3.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-28deg)}30%{transform:rotate(24deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}}
.ccb{display:flex;gap:3px;align-items:flex-end;height:44px}
.ccb i{width:7px;border-radius:4px;background:var(--line);transition:background .3s,height .4s cubic-bezier(.3,1.4,.5,1)}
.ccb i.on{background:var(--cc,var(--g))}
.ecg{position:relative;height:46px;overflow:hidden;border-radius:14px;background:rgba(10,20,15,.82);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.ecg svg{position:absolute;left:0;top:3px;height:40px}

.mon{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:12px}
.mon .rd{display:flex;gap:12px;font-variant-numeric:tabular-nums;font-weight:750;font-size:14px;flex-wrap:wrap}
.mon .rd span{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.mon .rd small{font-size:10px;color:var(--mu);font-weight:700}
.fx .drop{animation:drip var(--d,1s) ease-in infinite}

.paws{display:flex;justify-content:center;gap:14px;margin:4px 0 12px}
.paws svg{width:26px;height:26px;fill:var(--p);opacity:0;animation:pawstep 2.4s ease-in-out infinite}
.paws svg:nth-child(odd){transform:translateY(-8px) rotate(-12deg)}.paws svg:nth-child(even){transform:translateY(6px) rotate(12deg)}
@keyframes pawstep{0%{opacity:0}15%,45%{opacity:.55}70%,100%{opacity:0}}
.okpop{animation:okpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes okpop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.slide{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.slide.dragging>.pill{transition:width .2s,height .2s,background .2s!important;box-shadow:var(--hi),0 8px 22px rgba(80,84,90,.28);background:var(--glass2)}
.slide>.hov{color:var(--p)!important}
/* --- cápsulas deslizantes --- */
.slide{position:relative;isolation:isolate}
.slide>.pill{position:absolute;left:0;top:0;z-index:-1;border-radius:999px;background:var(--glass2);box-shadow:var(--hi),0 3px 10px rgba(80,84,90,.16);pointer-events:none;transition:transform .5s cubic-bezier(.34,1.32,.5,1),width .5s cubic-bezier(.34,1.32,.5,1),height .4s ease,background .3s,opacity .25s;will-change:transform}

.seg.slide>.pill{border-radius:14px}
.nab.slide>.pill[data-k=n]{background:var(--g)}.nab.slide>.pill[data-k=a]{background:var(--r)}
.nab.slide>.pill{box-shadow:0 2px 6px rgba(0,0,0,.12)}
.nab span{position:relative}
.nab span.n.on,.nab span.a.on{color:#fff}
.htabs{display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:20px;background:var(--field);border:1px solid var(--bd);margin-top:12px}
.htabs span{flex:1 1 auto;text-align:center;padding:9px 14px;border-radius:999px;font-weight:650;font-size:14px;color:var(--mu);cursor:pointer;user-select:none;-webkit-user-select:none}
.htabs span.on,.seg span.on{color:var(--p)}
.htabs>.pill{border-radius:999px}
/* --- validación --- */
.req label::after{content:" *";color:var(--r)}
input.bad{border-color:var(--r);box-shadow:0 0 0 4px var(--rl)}
.shake{animation:shake .4s}

/* ===== 0.9.3: hoja de opciones glassy, medicación simple, escarabajo ===== */
.sheetbg{background:rgba(22,23,24,.18);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);transition:opacity .35s ease}

.opt .oi{width:44px;height:44px;border-radius:15px;background:linear-gradient(150deg,#a7abb1,var(--p));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(114,118,125,.3)}
.opt .oi.g{background:linear-gradient(150deg,#4fd08f,var(--g));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(35,162,106,.3)}

.mhead{display:flex;align-items:center;gap:12px;margin-bottom:2px}

.fab{transition:transform .5s cubic-bezier(.3,1.5,.5,1),background .3s,box-shadow .3s}
.fab.open{transform:rotate(0) scale(.92);background:rgba(255,255,255,.7);color:var(--p);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 6px 20px rgba(35,37,40,.2)}

@keyframes fabp{0%,100%{box-shadow:0 6px 18px rgba(35,37,40,.22),0 0 0 0 rgba(224,69,58,.0)}50%{box-shadow:0 6px 18px rgba(35,37,40,.22),0 0 0 10px rgba(224,69,58,.12)}}
/* medicación simple */

.hbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--glass2);color:var(--mu);border-radius:999px;padding:7px 14px 7px 10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--sh);transition:transform .2s}

.bugbg{position:fixed;inset:0;z-index:105;background:rgba(22,23,24,.22);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);display:flex;justify-content:center;align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 12px 12px;opacity:0;transition:opacity .3s}

.bug{width:min(680px,100%);margin-top:min(12vh,90px);max-height:calc(100vh - 40px);display:flex;flex-direction:column;border-radius:30px;background:rgba(255,255,255,.7);-webkit-backdrop-filter:saturate(190%) blur(44px);backdrop-filter:saturate(190%) blur(44px);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 30px 90px rgba(35,37,40,.3);transform:translateY(-14px) scale(.96);transition:transform .55s cubic-bezier(.2,1.3,.3,1);overflow:hidden}

.bugbg.on .bug{transform:none}
.bugin{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}

@keyframes legA{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}

.bugres{overflow:auto;padding:8px 10px 14px;-webkit-overflow-scrolling:touch}
.bgh{font-size:11.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:12px 10px 4px}
.bri{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;cursor:pointer;animation:bri .35s cubic-bezier(.3,1.2,.5,1) both}

/* ===== GRIMORIO: cartas de logros ===== */

const KEY='sisvet_db_v1';
const DEF_AUT=`Yo, {propietario}, en mi carácter de propietario(a) y/o responsable del paciente {paciente} ({especie}, {raza}, {sexo}, {edad}), autorizo a {clinica} y a su personal médico veterinario a realizar el internamiento (hospitalización) de mi mascota a partir del día {fecha}, por el motivo: {motivo}.

Autorizo la realización de los procedimientos diagnósticos y terapéuticos que el médico veterinario considere necesarios para su atención, incluyendo toma de muestras, estudios de laboratorio e imagen, fluidoterapia, administración de medicamentos y, en su caso, sedación. Se me ha explicado el estado de salud actual del paciente, el pronóstico ({pronostico}) y los riesgos inherentes al tratamiento y a la hospitalización, y entiendo que la medicina veterinaria no es una ciencia exacta, por lo que no se me puede garantizar un resultado.

Se me informó un presupuesto estimado de {presupuesto}, que puede modificarse según la evolución del paciente, y me comprometo a cubrir el total de los gastos generados. Dejo un anticipo de {anticipo}. Cualquier procedimiento adicional de riesgo (cirugía, anestesia general, transfusión) me será consultado previamente, salvo urgencia que ponga en riesgo la vida del paciente.

En caso de requerir comunicación, me pueden localizar en el teléfono {telefono}. Me comprometo a recoger a mi mascota al ser dada de alta o en el momento en que se me notifique.`;

function fmtQty(q,unit){if(unit==='mg/ml'||unit==='UI/ml')return(Math.round(q*100)/100).toString().replace(/\.?0+$/,'')+' ml';const r=Math.round(q*4)/4,w=Math.floor(r),f=r-w,fr={0.25:'¼',0.5:'½',0.75:'¾'}[f]||'';const s=(w?w:'')+(fr?(w?' ':'')+fr:'')||'0';const word=unit==='mg/cáps'?'cápsula':'tableta';return`${s} ${word}${r>1?'s':''}`}

const pillMem={};
function pills(){document.querySelectorAll('.slide').forEach(c=>{let p=c.querySelector(':scope>.pill');if(!p){p=document.createElement('i');p.className='pill';c.prepend(p)}const a=c.querySelector(':scope>.on');const key=c.id;if(!a||!a.offsetWidth){p.style.opacity=0;return}const r={x:a.offsetLeft,y:a.offsetTop,w:a.offsetWidth,h:a.offsetHeight};p.dataset.k=a.classList.contains('a')?'a':a.classList.contains('n')?'n':'';const old=key&&pillMem[key];if(!p._init){p.style.transition='none';setPill(p,old||r);p.offsetWidth;p.style.transition=''}p._init=1;requestAnimationFrame(()=>{setPill(p,r);p.style.opacity=1});if(key)pillMem[key]=r})}
function setPill(p,r){p.style.transform=`translate(${r.x}px,${r.y}px)`;p.style.width=r.w+'px';p.style.height=r.h+'px'}
let drag=null;
function nearest(items,x,y){let best=null,bd=1e9;items.forEach(i=>{const r=i.getBoundingClientRect();const dx=x-(r.left+r.width/2),dy=(y-(r.top+r.height/2))*2.2;const d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}});return best}
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.slide');if(!c||(e.pointerType==='mouse'&&e.button!==0))return;const p=c.querySelector(':scope>.pill');if(!p||p.style.opacity==='0')return;drag={c,p,items:[...c.children].filter(x=>x!==p),x0:e.clientX,y0:e.clientY,id:e.pointerId,on:false}});
document.addEventListener('pointermove',e=>{const d=drag;if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.x0,dy=e.clientY-d.y0;if(!d.on){if(Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)){d.on=true;d.c.classList.add('dragging');try{d.c.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(dy)>10){drag=null;return}else return}
 e.preventDefault();const it=nearest(d.items,e.clientX,e.clientY);d.near=it;const cr=d.c.getBoundingClientRect();const w=it.offsetWidth,h=it.offsetHeight;const x=clamp(e.clientX-cr.left-w/2,0,d.c.clientWidth-w);setPill(d.p,{x,y:it.offsetTop,w,h});d.items.forEach(i=>i.classList.toggle('hov',i===it))},{passive:false});
function dragEnd(e){const d=drag;drag=null;if(!d||!d.on)return;d.c.classList.remove('dragging');d.items.forEach(i=>i.classList.remove('hov'));const it=d.near;if(it&&!it.classList.contains('on'))it.click();else pills();d.c._noclick=Date.now()}

document.addEventListener('click',e=>{const c=e.target.closest('.slide');if(c&&c._noclick&&Date.now()-c._noclick<400){e.stopPropagation();e.preventDefault();c._noclick=0}},true);

/* ---------------- cielo según la hora ---------------- */
/* =====================================================================
   CIELO DINÁMICO · hora solar real, luna con su fase, nubes, clima
   ===================================================================== */
const SKY={cv:null,cx:null,w:0,h:0,dpr:1,stars:[],clouds:[],drops:[],t0:0,last:0,run:false,spr:{},sprKey:'',mw:null,moonC:null,moonKey:'',flash:0,bolt:null,prev:null,wx:{code:1,cover:28,at:0},geo:null};
const SKYC=(a,b,t)=>{const p=x=>[parseInt(x.slice(1,3),16),parseInt(x.slice(3,5),16),parseInt(x.slice(5,7),16)];const A=p(a),B=p(b);return A.map((v,i)=>Math.round(v+(B[i]-v)*t))};
const rgbS=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a??1})`;
const mixC=(A,B,t)=>A.map((v,i)=>Math.round(v+(B[i]-v)*t));
/* paleta del cielo según la altura del sol (grados) */
const SKYK=[[-90,'#03050b','#070b16'],[-18,'#04060d','#0b1222'],[-12,'#081024','#18213c'],[-7,'#101d3c','#3a3a55'],[-3,'#1d3563','#a8625a'],[0,'#2c4f86','#f08a55'],[3,'#3d6aa8','#ffae6e'],[8,'#4b84c8','#f7cfa6'],[15,'#4a8bd6','#d6e4f0'],[30,'#3f84dc','#b9d8f4'],[90,'#2f76d8','#a6cff5']];
function skyCols(e){for(let i=1;i<SKYK.length;i++){if(e<=SKYK[i][0]){const a=SKYK[i-1],b=SKYK[i],t=(e-a[0])/(b[0]-a[0]);return[SKYC(a[1],b[1],t),SKYC(a[2],b[2],t)]}}return[SKYC('#2f76d8','#2f76d8',0),SKYC('#a6cff5','#a6cff5',0)]}
/* posición del sol: amanecer/atardecer reales por fecha y ubicación (Ciudad de México por omisión) */
function solar(d){const lat=(SKY.geo?.lat??19.43)*Math.PI/180,lon=SKY.geo?.lon??-99.13;const N=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);const dec=23.44*Math.PI/180*Math.sin(2*Math.PI*(284+N)/365);const tz=-d.getTimezoneOffset()/60;const noon=12-(lon/15-tz);const H0=Math.acos(Math.max(-1,Math.min(1,-Math.tan(lat)*Math.tan(dec))))*180/Math.PI/15;const h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;const ha=(h-noon)*15*Math.PI/180;const el=Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(ha))*180/Math.PI;return{el,rise:noon-H0,set:noon+H0,noon,h}}
function moonInfo(d){const syn=29.530588853;const ref=Date.UTC(2000,0,6,18,14);let age=((d.getTime()-ref)/864e5)%syn;if(age<0)age+=syn;const p=age/syn*2*Math.PI;const S=solar(d);const transit=(S.noon+age/syn*24)%24;let dh=S.h-transit;if(dh>12)dh-=24;if(dh<-12)dh+=24;const el=Math.cos(dh/12.4*Math.PI)*62-8;return{age,p,el,dh,lit:(1-Math.cos(p))/2}}
function skyNow(){return SKY.prev?.date||new Date()}

/* ---- sprites ---- */
function rr(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function cloudSprite(seed,W,H,top,base,dens){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');const r=rr(seed);
 const n=Math.round(48*dens);for(let i=0;i<n;i++){const u=r();const x=W*.1+u*W*.8;const dome=Math.sin(u*Math.PI);const R=H*(.08+r()*.14)*(.55+dome*.75);const y=H*.72-dome*H*(.18+r()*.2)-r()*R*.4;const gr=g.createRadialGradient(x,y,R*.15,x,y,R);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(.45,'rgba(255,255,255,.6)');gr.addColorStop(.8,'rgba(255,255,255,.18)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,R,0,7);g.fill()}
 for(let i=0;i<14;i++){const x=W*.1+r()*W*.8,y=H*.74+r()*H*.08,R=H*(.1+r()*.08);const gr=g.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,'rgba(255,255,255,.6)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,R,0,7);g.fill()}
 g.globalCompositeOperation='source-atop';const lg=g.createLinearGradient(0,H*.15,0,H*.85);lg.addColorStop(0,rgbS(top));lg.addColorStop(.45,rgbS(mixC(top,base,.35)));lg.addColorStop(1,rgbS(base));g.fillStyle=lg;g.fillRect(0,0,W,H);
 g.globalCompositeOperation='source-atop';for(let i=0;i<40;i++){const x=r()*W,y=r()*H*.8,R=4+r()*18;const gr=g.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,`rgba(${top[0]},${top[1]},${top[2]},.35)`);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,R,0,7);g.fill()}
 return c}
function moonTex(R){const c=document.createElement('canvas');c.width=c.height=R*2+4;const g=c.getContext('2d');const o=R+2;const r=rr(11);

 const vs=h.vitals.filter(v=>num(v.temp)).sort((a,b)=>a.t.localeCompare(b.t));if(vs.length>=2){const a=num(vs[vs.length-2].temp),b=num(vs[vs.length-1].temp);if(b-a>=1)out.push({c:'r',k:'temp',t:`${p.nombre}: la temperatura subió ${rnd(b-a)} °C`,s:`De ${a} a ${b} °C`,when:new Date(vs[vs.length-1].t).getTime()})}
 const stay=now-new Date(h.ingreso);if(stay>48*36e5&&!evSince(h,['Defecó','Diarrea'],48*36e5)&&!h.vitals.some(v=>v.hec&&v.hec!=='No'&&now-new Date(v.t)<48*36e5))out.push({c:'y',k:'hec',t:`${p.nombre}: 48 h sin defecar`,s:'No hay registro de heces en 48 h',when:now});
 if(stay>24*36e5&&!evSince(h,['Comió','Comió poco'],24*36e5)&&!h.vitals.some(v=>(v.come==='Sí'||v.come==='Poco')&&now-new Date(v.t)<24*36e5))out.push({c:'y',k:'come',t:`${p.nombre}: 24 h sin registro de que coma`,s:'Registra "Comió" o "No comió"',when:now});
 if(h.altaProg&&dayDiff(h.altaProg)<=0)out.push({c:'g',k:'alta',t:`${p.nombre} se va a casa hoy`,s:h.dx||h.motivo,when:now});
 return out}

/* --- Mi turno --- */
function turnoTasks(){const now=Date.now(),T=[];sched(now-2*864e5,now+60*6e4).filter(x=>x.st!=='done').forEach(x=>T.push({k:'dose',t:x.t,late:x.t<=now,h:x.h,p:x.p,x}));db.hosps.filter(h=>!h.alta).forEach(h=>{const p=pat(h.pid)||{};
  clinAlerts(h).filter(a=>['vit','flu','alta'].includes(a.k)).forEach(a=>T.push({k:a.k,t:Math.min(a.when,now),late:a.c==='r'||a.when<now-30*6e4,h,p,a}))});
 return T.sort((a,b)=>a.t-b.t)}
function taskCard(T){const now=Date.now();const p=T.p,h=T.h;const when=T.t<=now?(T.late&&now-T.t>6e4?'hace '+ago(now-T.t):'ahora'):'en '+ago(T.t-now);
 if(T.k==='dose'){const x=T.x;return`<div class="tk ${T.late?'late':''}"><div class="tkh">${av(p)}<div class="tx"><b>Toca ${esc(x.m.name)} a ${esc(p.nombre)}</b><div>${esc(doseTxt(x))}${h.jaula?' · Jaula '+esc(h.jaula):''}</div></div><span class="when">${new Date(x.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false})}<br>${when}</span></div>${slider('Desliza al aplicar',()=>giveDose(x.m.id,'',h.id))}<div class="tka"><button class="btn sm" onclick="snoozeDose('${x.m.id}','${h.id}',15)">Posponer 15 min</button><button class="btn sm" onclick="skipDose('${x.m.id}','${h.id}')">Omitir</button></div></div>`}
 if(T.k==='vit')return`<div class="tk ${T.late?'late':''}"><div class="tkh">${av(p)}<div class="tx"><b>${esc(T.a.t)}</b><div>${esc(T.a.s)}</div></div><span class="when">${when}</span></div>${slider('Desliza para medir',()=>openVitQ(h.id))}</div>`;
 if(T.k==='flu')return`<div class="tk ${T.late?'late':''}"><div class="tkh">${av(p)}<div class="tx"><b>${esc(T.a.t)}</b><div>${esc(T.a.s)}</div></div><span class="when">${when}</span></div>${slider('Desliza: bolsa nueva',()=>newBag(h.id,T.a.f.id))}<div class="tka"><button class="btn sm" onclick="stopFlu('${h.id}','${T.a.f.id}')">Suspender fluidos</button></div></div>`;
 if(T.k==='alta')return`<div class="tk"><div class="tkh">${av(p)}<div class="tx"><b>${esc(T.a.t)}</b><div>${esc(T.a.s)}${p.tel?' · avisar al '+esc(p.tel):''}</div></div><span class="when">hoy</span></div>${slider('Desliza para preparar el alta',()=>go('hosp',{id:h.id,tab:'alta'}))}</div>`;return''}
function vTurno(){const now=Date.now();const T=turnoTasks();const [f,t]=dayRange(0);const today=sched(f,t);const done=today.filter(y=>y.st==='done').length,tot=today.length;const pc=tot?done/tot:1;const C=2*Math.PI*25;
 if(!T.length&&done>=5){db.stats=db.stats||{};const dkk=isoLocal().slice(0,10);db.stats.turnoDays=db.stats.turnoDays||[];if(!db.stats.turnoDays.includes(dkk)){db.stats.turnoDays.push(dkk);save()}}
 const later=sched(now+60*6e4,t).filter(x=>x.st!=='done');const act=db.hosps.filter(h=>!h.alta);
 const hr=new Date().getHours();const sal=hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches';
 return`<div class="hello"><div><div class="muted">${sal}${db.settings.user?', '+esc(db.settings.user.split(' ')[0]):''}</div><h1>Mi turno</h1></div><div class="bar"><button class="btn sm pri" onclick="openQH()">Hospitalizar rápido</button><button class="btn sm" onclick="go('board')">Tablero</button><button class="btn sm" onclick="copyTxt(dayText(0))">Entrega de turno</button></div></div>
 <div class="card"><div class="nextd"><div class="ring"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="25" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="29" cy="29" r="25" fill="none" stroke="var(--g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc)}" style="transition:stroke-dashoffset 1s"/></svg><b>${done}/${tot}</b></div><div class="inf"><div class="t1">Hoy</div><div class="t2">${T.length?`${T.length} pendiente${T.length>1?'s':''} ahora`:'Todo al día'}</div><div class="t3">${act.length} hospitalizado${act.length!==1?'s':''} · ${done} dosis aplicadas · ${later.length} más tarde</div></div></div></div>
 ${ambCard()}
 ${T.length?T.map(taskCard).join(''):`<div class="card celebr"><svg viewBox="0 0 84 84"><circle class="cc" cx="42" cy="42" r="38" fill="none" stroke="var(--g)" stroke-width="4"/><path class="ck" d="M26 43l11 11 21-23" fill="none" stroke="var(--g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h2 style="margin:12px 0 4px">Turno al día</h2><div class="muted">${act.length?`Nada pendiente en la próxima hora.${done?` Llevas ${done} dosis aplicadas hoy.`:''}`:'No hay pacientes hospitalizados.'}</div></div>`}
 ${later.length?`<div class="card"><div class="sec"><h2>Más tarde hoy</h2><a onclick="go('day',{d:'hoy'})">Ver el día</a></div>${timeline(later.slice(0,12),0)}</div>`:''}
 ${act.length?`<div class="card"><div class="sec"><h2>Registro rápido</h2></div><div class="muted small" style="margin-bottom:6px">Un toque registra el evento con la hora.</div>${act.map(h=>{const p=pat(h.pid)||{};return`<div style="padding:10px 0;border-top:1px solid var(--line)"><div class="bar">${av(p,'width:34px;height:34px;border-radius:11px')}<b>${esc(p.nombre)}</b><span class="sp"></span><button class="btn sm" onclick="openVitQ('${h.id}')">Constantes</button></div>${evChips(h.id)}</div>`}).join('')}</div>`:''}`}

/* --- fluidos: bolsa nueva / suspender --- */
function newBag(hid,fid){const h=hosp(hid);const f=h.fluids.find(x=>x.id===fid);if(!f)return;f.done=true;h.fluids.push(stamp({id:uid(),t:isoLocal(),sol:f.sol,rate:f.rate,add:f.add,vol:f.vol,by:me()}));logA('Bolsa nueva',`${pat(h.pid)?.nombre}: ${f.sol} ${f.vol} ml a ${f.rate} ml/h`,h.pid);save();toast('Bolsa nueva registrada');render()}
function stopFlu(hid,fid){const h=hosp(hid);const f=h.fluids.find(x=>x.id===fid);if(f){f.done=true;f.stop=isoLocal()}logA('Fluidos suspendidos',pat(h.pid)?.nombre,h.pid);save();toast('Fluidos suspendidos');render()}

/* --- constantes rápidas (teclado grande, en secuencia) --- */
const QV=[{k:'temp',l:'Temperatura',u:'°C'},{k:'fc',l:'Frecuencia cardiaca',u:'lpm'},{k:'fr',l:'Frecuencia respiratoria',u:'rpm'},{k:'tllc',l:'Llenado capilar',u:'s'},{k:'muc',l:'Mucosas',o:['Rosadas','Pálidas','Ictéricas','Cianóticas','Hiperémicas']},{k:'dolor',l:'Dolor (0 a 4)',o:['0','1','2','3','4']},{k:'ev',l:'¿Qué más observaste?',m:['Comió','Comió poco','No comió','Orinó','Defecó','Diarrea','Vomitó']}];
let qv=null;
async function openVitQ(hid){if(!await ensureUser())return;const h=hosp(hid);qv={hid,i:0,v:{},ev:[],prev:lastVit(h)||{}};sh={step:'vitq'};const bg=$('#sheetbg');bg.hidden=false;drawQV();requestAnimationFrame(()=>requestAnimationFrame(()=>bg.classList.add('on')))}
function drawQV(back){const h=hosp(qv.hid),p=pat(h.pid)||{};const S=QV[qv.i];const val=qv.v[S.k]||'';
 let body='';if(S.u){body=`<div class="qhead"><div class="ic" id="qv_ic" style="${fxVars(S.k,val)}">${FXSVG[S.k]('')}</div><div><div class="qval" id="qv_val">${esc(val)||'<span class="muted">--</span>'}<small>${S.u}</small></div><div class="qprev">${qv.prev[S.k]?`Anterior: ${esc(qv.prev[S.k])} ${S.u}`:'Sin registro anterior'}</div></div></div>
  <div class="kp">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button onclick="qvKey('${k}')">${k}</button>`).join('')}</div>`}
 else if(S.o)body=`<div class="qopts" style="margin:10px 0">${S.o.map(o=>`<span class="chip ${qv.v[S.k]===o?'on':''}" onclick="qv.v['${S.k}']=qv.v['${S.k}']==='${o}'?'':'${o}';drawQV(0,1)">${o}</span>`).join('')}</div><div class="qprev">${qv.prev[S.k]?'Anterior: '+esc(qv.prev[S.k]):''}</div>`;
 else body=`<div class="qopts" style="margin:10px 0">${S.m.map(o=>`<span class="chip ${qv.ev.includes(o)?'on':''}" onclick="qvEv('${o}')">${o}</span>`).join('')}</div><label style="margin-top:6px">Nota (opcional)</label><input id="qv_obs" value="${esc(qv.v.obs||'')}" oninput="qv.v.obs=this.value" placeholder="Algo que deba saber el siguiente turno">`;
 const last=qv.i===QV.length-1;
 $('#sheet').innerHTML=`<div class="${arguments[1]?'':'step '+(back?'back':'')} qv"><div class="grab"></div><div class="bar">${av(p,'width:34px;height:34px;border-radius:11px')}<b>${esc(p.nombre)}</b><span class="muted small">Constantes</span><span class="sp"></span><button class="btn sm" onclick="closeSheet()">Cerrar</button></div>
 <div class="qdots" style="margin-top:12px">${QV.map((q,i)=>`<i class="${i===qv.i?'on':(qv.v[q.k]||(q.m&&qv.ev.length))?'ok':''}"></i>`).join('')}</div><h2 style="margin:4px 0">${S.l}</h2>${body}
 <div class="bar" style="margin-top:12px">${qv.i>0?`<button class="btn" onclick="qv.i--;drawQV(1)">Atrás</button>`:''}${S.u&&qv.prev[S.k]?`<button class="btn" onclick="qv.v['${S.k}']='${esc(qv.prev[S.k])}';qvNext()">Igual que antes</button>`:''}<span class="sp"></span>${last?`<button class="btn pri" onclick="qvSave()">Guardar</button>`:`<button class="btn ${val?'pri':''}" onclick="qvNext()">${val||S.m?'Siguiente':'Saltar'}</button>`}</div></div>`}
function qvKey(k){const S=QV[qv.i];let v=qv.v[S.k]||'';if(k==='⌫')v=v.slice(0,-1);else if(k==='.'){if(!v.includes('.'))v=(v||'0')+'.'}else if(v.length<5)v+=k;qv.v[S.k]=v;const el=$('#qv_val');if(el)el.innerHTML=(esc(v)||'<span class="muted">--</span>')+`<small>${S.u}</small>`;const ic=$('#qv_ic');if(ic)ic.setAttribute('style',fxVars(S.k,v));const nb=$('#sheet .bar:last-child .btn:last-child');if(nb&&qv.i<QV.length-1){nb.textContent=v?'Siguiente':'Saltar';nb.className='btn '+(v?'pri':'')}}
function qvNext(){if(qv.i<QV.length-1){qv.i++;drawQV()}}
function qvEv(o){const i=qv.ev.indexOf(o);if(i>=0)qv.ev.splice(i,1);else qv.ev.push(o);drawQV(0,1)}
function qvSave(){bump('qv');const h=hosp(qv.hid);const v=Object.assign({id:uid(),t:isoLocal(),by:me()},qv.v);if(qv.ev.includes('Comió'))v.come='Sí';else if(qv.ev.includes('Comió poco'))v.come='Poco';else if(qv.ev.includes('No comió'))v.come='No';if(qv.ev.includes('Orinó'))v.ori='Sí';if(qv.ev.includes('Diarrea'))v.hec='Diarrea';else if(qv.ev.includes('Defecó'))v.hec='Normales';if(qv.ev.includes('Vomitó'))v.vom='Sí';
 h.vitals.push(stamp(v));h.events=h.events||[];qv.ev.forEach(k=>h.events.push(stamp({id:uid(),t:v.t,k,by:me()})));logA('Constantes',`${pat(h.pid)?.nombre}: T ${v.temp||'--'} · FC ${v.fc||'--'} · FR ${v.fr||'--'}`,h.pid);save();closeSheet();toast(`Constantes de ${pat(h.pid)?.nombre} registradas`);setTimeout(render,300)}

 return`<div class="bdh"><div><div class="muted">${now.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Tablero de hospitalización</h1></div><div style="text-align:right"><div class="clk">${now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false})}</div><button class="btn sm" onclick="try{document.documentElement.requestFullscreen()}catch(e){}">Pantalla completa</button></div></div>

  ${al.length?`<div class="al2">${al.map(a=>`<span class="${a.c==='r'?'r':''}">${esc(a.t.replace(p.nombre+': ',''))}</span>`).join('')}</div>`:''}

/* --- hoja automática: cargos y resumen --- */
function hospCounts(h,wp){const c={};h.admin.filter(a=>!a.skip).forEach(a=>{const m=h.meds.find(x=>x.id===a.mid);if(!m)return;const k=m.name+(wp&&m.pres?' · '+m.pres:'');c[k]=(c[k]||0)+1});return c}
function autoResumen(h){const p=pat(h.pid)||{};const end=h.alta?.date?new Date(h.alta.date):new Date();const d=Math.max(1,Math.ceil((end-new Date(h.ingreso))/864e5));const C=hospCounts(h);const vs=h.vitals.filter(v=>num(v.temp)).sort((a,b)=>a.t.localeCompare(b.t));const ev={};(h.events||[]).forEach(e=>ev[e.k]=(ev[e.k]||0)+1);const om=h.admin.filter(a=>a.skip).length;
 const L=[];L.push(`${p.nombre} (${[p.especie,p.raza,ageStr(p)].filter(Boolean).join(', ')}) ingresó el ${fdate(h.ingreso,1)} por ${(h.motivo||'—').toLowerCase()}${h.dx?', con diagnóstico de '+h.dx.toLowerCase():''}. Estancia de ${d} día${d>1?'s':''}.`);
 if(h.est?.st)L.push(`Estudios: ${estText(h.est)}${h.est.res?' Resultados: '+h.est.res:''}`);
 const ks=Object.keys(C);if(ks.length)L.push(`Tratamiento administrado: ${ks.map(k=>`${k}, ${C[k]} dosis`).join('; ')}.${om?` Se omitieron ${om} dosis con motivo registrado.`:''}`);
 if(h.fluids.length)L.push(`Fluidoterapia con ${[...new Set(h.fluids.map(f=>f.sol))].join(', ')}.`);
 if(vs.length)L.push(`Evolución: temperatura de ${vs[0].temp} °C en el primer registro a ${vs[vs.length-1].temp} °C en el último${vs[vs.length-1].fc?`, FC ${vs[vs.length-1].fc} lpm`:''}${vs[vs.length-1].fr?`, FR ${vs[vs.length-1].fr} rpm`:''}.`);
 const evs=Object.keys(ev);if(evs.length)L.push(`Registros de cuidado: ${evs.map(k=>`${k.toLowerCase()} (${ev[k]})`).join(', ')}.`);
 const lastN=h.notes.slice().sort((a,b)=>b.t.localeCompare(a.t))[0];if(lastN)L.push(`Última nota: ${lastN.text}`);
 return L.join('\n')}
function docCargos(h){const p=pat(h.pid)||{};const end=h.alta?.date?new Date(h.alta.date):new Date();const d=Math.max(1,Math.ceil((end-new Date(h.ingreso))/864e5));const C=hospCounts(h,1);const rows=[[`Días de hospitalización`,d]];Object.keys(C).forEach(k=>rows.push([k,C[k]+' dosis']));const bags={};h.fluids.forEach(f=>{const k=f.sol+(f.vol?' '+f.vol+' ml':'');bags[k]=(bags[k]||0)+1});Object.keys(bags).forEach(k=>rows.push(['Fluidoterapia: '+k,bags[k]+(bags[k]>1?' bolsas':' bolsa')]));if(h.est?.st==='si')estList(h.est).split('; ').forEach(x=>rows.push(['Estudio: '+x,1]));
 return`<div class="doc">${memb()}<h2>Cargos de hospitalización</h2>${pdata(p,`<div><b>Ingreso:</b> ${fdate(h.ingreso,1)}</div><div><b>${h.alta?'Alta':'Corte'}:</b> ${fdate(end.toISOString(),1)}</div><div><b>Dx:</b> ${esc(h.dx||h.motivo)}</div>`)}
 <table style="margin-top:12px"><tr><th>Concepto</th><th style="width:90px">Cantidad</th><th style="width:100px">Precio</th><th style="width:100px">Importe</th></tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td></td><td></td></tr>`).join('')}<tr><td colspan="3" style="text-align:right"><b>Total</b></td><td></td></tr></table>
 <p class="small" style="margin-top:8px">Generado automáticamente con lo registrado en la hospitalización. ${h.presu?'Presupuesto informado: $'+esc(h.presu)+'.':''} ${h.antic?'Anticipo: $'+esc(h.antic)+'.':''}</p></div>`}

/* --- consulta que se adelanta --- */
function prevCons(pid,exId){return db.consults.filter(c=>c.pid===pid&&c.id!==exId).sort((a,b)=>b.date.localeCompare(a.date))}
function pSummary(c){const p=pat(c.pid)||{};const pc=prevCons(c.pid,c.id);const last=pc[0];const L=[];
 L.push(`<b>${esc(p.nombre)}</b>, ${esc([p.especie,p.raza,ageStr(p)].filter(Boolean).join(', '))}${lastWeight(p.id)?` · último peso ${lastWeight(p.id)} kg`:''}.`);
 if(last)L.push(`Última visita ${relDay(last.date).toLowerCase()}${dayDiff(last.date)<-1?` (${fdate(last.date)})`:''} por ${esc((last.dx||last.motivo||'consulta').toLowerCase())}${last.rx?.length?`; se recetó ${esc(last.rx.map(r=>r.name).join(', '))}`:''}.`);else L.push('Primera consulta registrada.');
 const vd=(p.vac||[]).filter(v=>v.prox).sort((a,b)=>a.prox.localeCompare(b.prox)).find(v=>dayDiff(v.prox)<=30);if(vd)L.push(`${vd.tipo==='Vacuna'?'Vacuna':'Desparasitación'} ${esc(vd.prod)} ${dayDiff(vd.prox)<0?'<b style="color:var(--r)">vencida '+relDay(vd.prox).toLowerCase()+'</b>':'vence '+relDay(vd.prox).toLowerCase()}.`);
 const hh=db.hosps.find(h=>h.pid===p.id&&!h.alta);if(hh)L.push(`<b>Hospitalizado</b> desde ${fdate(hh.ingreso)}.`);
 if(p.alergias)L.push(`<b style="color:var(--r)">Alergias: ${esc(p.alergias)}</b>`);

let rec=null,dictTxt='',dictInt='';
function parseDict(t){let s=nrm(t).replace(/(\d+)\s*(punto|coma)\s*(\d+)/g,'$1.$3').replace(/,/g,'.');const V={},got=[];const m=(re,k,lab,f)=>{const x=s.match(re);if(x){V[k]=f?f(x):x[x.length-1];got.push(`${lab} ${V[k]}`)}};
 m(/(?:temperatura|temp)\D{0,14}(\d{2}(?:\.\d)?)/,'temp','T');m(/(?:frecuencia cardiaca|fc|pulso)\D{0,14}(\d{2,3})/,'fc','FC');m(/(?:frecuencia respiratoria|fr|respiraciones)\D{0,14}(\d{1,3})/,'fr','FR');m(/(?:llenado capilar|tllc|tiempo de llenado)\D{0,18}(\d(?:\.\d)?)/,'tllc','TLLC');m(/(?:peso|pesa)\D{0,10}(\d{1,3}(?:\.\d{1,2})?)/,'peso','Peso');m(/(?:condicion corporal)\D{0,10}(\d)/,'cc','CC');
 const mu=s.match(/mucosas?\s+(rosadas|palidas|ictericas|cianoticas|hiperemicas|congestionadas)/);if(mu){V.muc={rosadas:'Rosadas',palidas:'Pálidas',ictericas:'Ictéricas',cianoticas:'Cianóticas',hiperemicas:'Hiperémicas',congestionadas:'Congestionadas'}[mu[1]];got.push('Mucosas '+V.muc.toLowerCase())}
 return{V,got}}
function startDict(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Este navegador no permite dictado. Prueba en Chrome o usa el micrófono del teclado.');return}if(rec)return stopDict();dictTxt='';dictInt='';rec=new SR();rec.lang='es-MX';rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{dictInt='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)dictTxt+=r[0].transcript+' ';else dictInt+=r[0].transcript}drawDict()};rec.onerror=e=>{if(e.error==='not-allowed')toast('Permite el uso del micrófono para dictar');};rec.onend=()=>{if(rec){try{rec.start()}catch(_){}}};
 try{rec.start()}catch(e){rec=null;toast('No se pudo iniciar el dictado');return}let d=$('#dict');if(!d){d=document.createElement('div');d.id='dict';d.className='dict';document.body.appendChild(d)}drawDict()}
function drawDict(){const d=$('#dict');if(!d)return;d.innerHTML=`<div class="bar"><span class="mic"></span><b>Escuchando…</b><span class="sp"></span><button class="btn sm" onclick="cancelDict()">Cancelar</button><button class="btn sm pri" onclick="stopDict()">Terminar</button></div><div class="dtx">${esc(dictTxt)}<i>${esc(dictInt)}</i>${!dictTxt&&!dictInt?'<i>Habla con naturalidad. Ejemplo: "temperatura 39 punto 4, frecuencia cardiaca 120, mucosas rosadas, el propietario refiere vómito desde ayer".</i>':''}</div>`}
function cancelDict(){const r=rec;rec=null;try{r&&r.stop()}catch(_){}$('#dict')?.remove()}
function stopDict(){const r=rec;rec=null;try{r&&r.stop()}catch(_){}const txt=(dictTxt+' '+dictInt).trim();$('#dict')?.remove();if(!txt||!draft)return;const{V,got}=parseDict(txt);bump('dict');Object.assign(draft.vit,V);draft.anam=(draft.anam?draft.anam.trim()+'\n':'')+'Dictado: '+txt;logA('Dictado',`${pat(draft.pid)?.nombre}: ${got.join(', ')||'texto'}`,draft.pid);toast(got.length?'Se llenó: '+got.join(', '):'Texto agregado a la anamnesis');render()}

 <div class="bar" style="margin-top:8px">${x&&x.v.st==='pend'?`<button class="btn sm pri" onclick="openAmbV('${a.id}','${t}')">Registrar hoy</button>`:''}${c?`<button class="btn sm" onclick="ambToNote('${a.id}')">Agregar resumen a la nota</button>`:''}<button class="btn sm" onclick="copyTxt(ambText(db.amb.find(y=>y.id==='${a.id}')))">Copiar resumen</button><span class="sp"></span><button class="btn sm" onclick="delAmb('${a.id}')">Eliminar</button></div></div>`}).join('')}</div>`}
function ambAns(q){const n=nrm(q);const A=db.amb||[];if(!A.length||!/vino|vinieron|medicar|ambulator/.test(n))return'';const P=db.patients.filter(p=>A.some(a=>a.pid===p.id)&&n.split(/\s+/).includes(nrm(p.nombre).split(' ')[0]));

function ago(ms){const m=Math.round(Math.abs(ms)/6e4);if(m<60)return m+' min';const h=Math.round(m/60);if(h<48)return h+' h';return Math.round(h/24)+' días'}
function dayDiff(d){const a=new Date(d);a.setHours(0,0,0,0);const b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function relDay(d){const n=dayDiff(d);return n===0?'Hoy':n===1?'Mañana':n===-1?'Ayer':n>1?`En ${n} días`:`Hace ${-n} días`}
function missing(p){const m=[];if(!p.tel)m.push('Sin teléfono');if(!num(p.peso)&&!lastWeight(p.id))m.push('Sin peso');if(!p.nac&&!p.anio&&!p.edad)m.push('Sin edad');if(!p.raza)m.push('Sin raza');return m}
function homeData(){const now=Date.now();const act=db.hosps.filter(h=>!h.alta);const A=[];
 act.forEach(h=>{const p=pat(h.pid)||{};const due=dueList(h);due.filter(d=>d.late).forEach(d=>A.push({lv:now-d.next>36e5?0:1,c:'r',t:`${p.nombre} · ${d.m.name}`,s:`Le toca su dosis · ${d.m.route} c/${d.m.freq} h`,w:'hace '+ago(now-d.next),go:`go('hosp',{id:'${h.id}',tab:'meds'})`}));
  clinAlerts(h).forEach(a=>A.push({lv:a.c==='r'?1:a.k==='alta'?3:2,c:a.c,t:a.t,s:a.s,w:'',go:a.k==='vit'?`openVitQ('${h.id}')`:a.k==='alta'?`go('hosp',{id:'${h.id}',tab:'alta'})`:a.k==='flu'?`go('turno')`:`go('hosp',{id:'${h.id}',tab:'evo'})`}));
  if(h.est?.st==='si'&&!h.est.res)A.push({lv:4,c:'b',t:`${p.nombre} · resultados pendientes`,s:estList(h.est),w:'',go:`go('hosp',{id:'${h.id}',tab:'ingreso'})`})});
 db.consults.forEach(c=>{const p=pat(c.pid);if(!p)return;if(act.some(h=>h.cid===c.id))return;if(c.est?.st==='si'&&!c.est.res&&dayDiff(c.date)>-15)A.push({lv:4,c:'b',t:`${p.nombre} · resultados pendientes`,s:estList(c.est),w:relDay(c.date),go:`go('consult',{id:'${c.id}',step:4})`})});
 A.sort((a,b)=>a.lv-b.lv);
 const citas=db.consults.filter(c=>c.prox&&dayDiff(c.prox)>=0&&dayDiff(c.prox)<=7&&!db.consults.some(x=>x.pid===c.pid&&x.date.slice(0,10)>=c.prox&&x.id!==c.id)).sort((a,b)=>a.prox.localeCompare(b.prox));
 const hoy=db.consults.filter(c=>dayDiff(c.date)===0);
 const inc=db.patients.map(p=>({p,m:missing(p)})).filter(x=>x.m.length).sort((a,b)=>b.m.length-a.m.length);
 const lateN=act.reduce((n,h)=>n+dueList(h).filter(d=>d.late).length,0);
 return{act,A,citas,hoy,inc,lateN,vac:vacDue(7)}}

function phPick(src){phTarget=view.name==='pform'?'form':view.id;$(src==='cam'?'#fileCam':'#fileGal').click()}
function phLoad(f){if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const S=280;const c=document.createElement('canvas');c.width=c.height=S;const m=Math.min(img.width,img.height);const ctx=c.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);const url=c.toDataURL('image/jpeg',.78);
 if(phTarget==='form'){phTmp=url;const b=$('#ph_big');if(b){b.style.backgroundImage=`url(${url})`;b.classList.add('has');b.classList.remove('pop');b.offsetWidth;b.classList.add('pop')}const q=$('#ph_del');if(q)q.style.display=''}
 else{const p=pat(phTarget);if(p){p.foto=url;p.updated=new Date().toISOString();save();toast('Foto actualizada');render()}}};img.onerror=()=>toast('No se pudo leer la imagen');img.src=r.result};r.readAsDataURL(f)}

 ${e.st==='si'?`<label>Laboratorio</label><div class="chips">${LABS.map(l=>`<span class="chip ${e.lab.includes(l)?'on':''}" onclick="estLab('${sc}','${l}')">${l}</span>`).join('')}</div>

 <label>Imagenología</label>

function estList(e){if(!e)return'';const a=[];if(e.lab?.length||e.labOtro)a.push('Laboratorio: '+[...(e.lab||[]),e.labOtro].filter(Boolean).join(', '));if(e.rx)a.push('Rayos X'+(e.rxReg?' ('+e.rxReg+')':''));if(e.us)a.push('Ultrasonido'+(e.usReg?' ('+e.usReg+')':''));if(e.otro)a.push(e.otro);return a.join('; ')}

function ageFrom(d){const b=new Date(d),n=new Date();if(isNaN(b))return'';let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0)return'';const a=Math.floor(m/12),r=m%12;return a?`${a} año${a>1?'s':''}${r?` ${r} mes${r>1?'es':''}`:''}`:`${r} mes${r!==1?'es':''}`}

function sendWA(id){const c=db.consults.find(c=>c.id===id),p=pat(c.pid),kg=num(c.vit.peso);let t=`*${db.settings.clinica}*\nIndicaciones para *${p.nombre}* (${fdate(c.date)})\n`;if(c.dx)t+=`\nDiagnóstico: ${c.dx}\n`;if(c.rx.length){t+='\n*Medicamentos:*\n';c.rx.forEach((r,i)=>t+=`${i+1}. ${rxText(r,kg)}\n`)}if(c.ind)t+=`\n${c.ind}\n`;if(c.est?.st==='si'&&estList(c.est))t+=`\nEstudios: ${estList(c.est)}\n`;if(c.prox)t+=`\nPróxima revisión: ${fdate(c.prox)}${c.proxm?' ('+c.proxm+')':''}`;window.open(`https://wa.me/${p.tel?waNum(p.tel):''}?text=${encodeURIComponent(t)}`,'_blank')}

async function newHosp(pid,cid){{const pp=pat(pid);if(!pp||!pp.nombre||!pp.prop){toast('El paciente necesita nombre y propietario');return go('pform',{id:pid,next:'hosp'})}}const p=pat(pid);const c=cid?db.consults.find(x=>x.id===cid):null;if(db.hosps.some(h=>h.pid===pid&&!h.alta)&&!await ask('Este paciente ya tiene una hospitalización activa. ¿Crear otra?'))return;
 const h={id:uid(),pid,cid:cid||'',ingreso:isoLocal(),motivo:c?.motivo||'',dx:c?.dx||'',pron:'Reservado',peso:(c&&num(c.vit.peso))||lastWeight(pid)||'',mvz:db.settings.mvz,presu:'',antic:'',jaula:'',dieta:'',est:c?.est?JSON.parse(JSON.stringify(c.est)):newEst(),meds:[],admin:[],vitals:[],fluids:[],notes:[],alta:null};
 if(c)c.rx.forEach(r=>h.meds.push({id:uid(),name:r.name,pres:r.pres,conc:r.conc,unit:r.unit,dose:r.dose,route:r.route,freq:r.freq,start:'',on:true}));
 h.vitInt=6;h.events=[];stamp(h);logA('Ingreso a hospitalización',`${p.nombre}: ${h.motivo||''}`,pid);db.hosps.push(h);save();go('hosp',{id:h.id,tab:'ingreso'})}
function hosp(id){return db.hosps.find(h=>h.id===id)}
function dueList(h){const t=Date.now();return h.meds.filter(m=>m.on&&num(m.freq)).map(m=>{const ad=h.admin.filter(a=>a.mid===m.id).sort((a,b)=>b.t.localeCompare(a.t))[0];let next=ad?new Date(ad.t).getTime()+num(m.freq)*36e5:(m.start?new Date(m.start).getTime():new Date(h.ingreso).getTime());const sn=h.snooze&&h.snooze[m.id];if(sn&&sn>next)next=sn;return{m,next,late:next<=t}}).sort((a,b)=>a.next-b.next)}
function dueBadge(h){const d=dueList(h);if(!d.length)return'';const late=d.filter(x=>x.late).length;return late?`<span class="tag r">${late} dosis pendiente${late>1?'s':''}</span>`:`<span class="tag y">próx. ${fhour(d[0].next)}</span>`}
function vHosps(){const act=db.hosps.filter(h=>!h.alta),done=db.hosps.filter(h=>h.alta).sort((a,b)=>b.ingreso.localeCompare(a.ingreso)).slice(0,20);
 const it=h=>{const p=pat(h.pid)||{};const d=Math.max(1,Math.ceil((Date.now()-new Date(h.ingreso))/864e5));return`<div class="it" onclick="go('hosp',{id:'${h.id}'})">${av(p)}<div style="flex:1"><b>${esc(p.nombre)}</b> ${h.jaula?`<span class="tag">Jaula ${esc(h.jaula)}</span>`:''}<div class="small muted">${esc(p.especie)} · ${esc(h.motivo)} · ${h.alta?'alta '+fdate(h.alta.date):'día '+d}</div></div>${h.alta?'':dueBadge(h)}</div>`};
 return`<div class="card"><div class="sec"><h2>Hospitalizados activos (${act.length})</h2><div class="bar"><button class="btn sm pri" onclick="openQH()">Hospitalización rápida</button>${act.length?`<button class="btn sm" onclick="go('board')">Tablero</button>`:''}</div></div>${act.length?`<div class="list">${act.map(it).join('')}</div>`:'<div class="empty">'+paws()+'No hay pacientes hospitalizados.<br><span class="small">Para hospitalizar, abre el expediente del paciente → Hospitalizar.</span></div>'}</div>${done.length?`<div class="card"><h2>Altas recientes</h2><div class="list">${done.map(it).join('')}</div></div>`:''}`}

function grid24(h,day,print){const d0=new Date(day);d0.setHours(0,0,0,0);const d1=d0.getTime()+864e5;let s=`<div class="grid24"><div class="hd nm">Fármaco · dosis · vía</div>`;for(let i=0;i<24;i++)s+=`<div class="hd">${i}</div>`;
 h.meds.filter(m=>m.on).forEach(m=>{const k=rxCalc(m,num(h.peso));const f=num(m.freq);const st=m.start?new Date(m.start).getTime():new Date(h.ingreso).getTime();const due=new Set();if(f>0){let t=st;if(t<d0.getTime()){t+=Math.ceil((d0.getTime()-t)/(f*36e5))*f*36e5}for(;t<d1;t+=f*36e5)due.add(new Date(t).getHours())}
  const ad=h.admin.filter(a=>a.mid===m.id&&!a.skip&&new Date(a.t)>=d0&&new Date(a.t)<d1);const done={};ad.forEach(a=>{done[new Date(a.t).getHours()]=fhour(a.t)});
  s+=`<div class="nm">${esc(m.name)}<br><span style="font-weight:400">${k?.qs?esc(k.qs):esc(m.qty||'')} ${esc(m.route)} c/${esc(m.freq)}h</span></div>`;
  for(let i=0;i<24;i++){const isD=due.has(i),isOk=done[i];const tt=new Date(d0);tt.setHours(i,0);s+=`<div class="${isOk?'done':isD?'due':''}" ${!print&&isD&&!isOk?`onclick="giveDose('${m.id}','${isoLocal(new Date())}')"`:''} title="${isOk||''}">${isOk?(print?'✓':'✓'):isD?(print?'☐':'•'):''}</div>`}});
 return s+'</div>'}
function addVit(){const h=hosp(view.id);const g=k=>$('#v_'+k).value.trim();const v={id:uid(),t:g('t')};['temp','fc','fr','tllc','pas','glu','peso','muc','dolor','act','come','ori','hec','vom','obs'].forEach(k=>v[k]=g(k));v.by=me();h.vitals.push(stamp(v));logA('Constantes',`${pat(h.pid)?.nombre}: T ${v.temp||'--'} · FC ${v.fc||'--'}`,h.pid);if(num(v.peso))h.peso=v.peso;save();toast('Constantes guardadas');render()}

function calcFlu(){const sp=$('#fl_sp')?.value,kg=num($('#fl_kg')?.value),dh=num($('#fl_dh').value)||0,hh=num($('#fl_h').value)||24,loss=num($('#fl_loss').value)||0;const o=$('#fl_out');if(!kg){o.textContent='Captura el peso.';return}const mant=(sp==='Felino'?80:132)*Math.pow(kg,.75);const def=dh/100*kg*1000;const rM=mant/24,rD=def/hh,rL=loss/24;const tot=rM+rD+rL;o.innerHTML=`Mantenimiento: <b>${Math.round(mant)} ml/día</b> (${rnd(rM)} ml/h · ${rnd(rM/kg)} ml/kg/h)<br>Déficit: <b>${Math.round(def)} ml</b> en ${hh} h (${rnd(rD)} ml/h)${loss?`<br>Pérdidas continuas: ${rnd(rL)} ml/h`:''}<br><span style="font-size:15px">Tasa total primeras ${hh} h: <b>${rnd(tot)} ml/h</b></span>${dh?`<br>Después: ${rnd(rM+rL)} ml/h`:''}<br><span class="small">Gotas/min — normogotero (20 gt/ml): ${Math.round(tot*20/60)} · microgotero (60 gt/ml): ${Math.round(tot)}</span>`;const r=$('#fo_rate');if(r&&!r.value)r.placeholder=rnd(tot);const dr=$('#fl_drip');if(dr){const gpm=tot*20/60;dr.style.setProperty('--d',gpm>0?clamp(60/gpm,.25,5)+'s':'1s')}}

 ${(()=>{const ad=h.admin.filter(a=>new Date(a.t).toDateString()===day.toDateString()).sort((a,b)=>a.t.localeCompare(b.t));return ad.length?`<h4>Dosis registradas</h4><table><tr><th>Hora</th><th>Fármaco</th><th>Dosis</th><th>Registró</th></tr>${ad.map(a=>{const m=h.meds.find(x=>x.id===a.mid)||{};return`<tr><td>${fhour(a.t)}</td><td>${esc(m.name||'')}</td><td>${esc(a.dose||'')}</td><td>${esc(a.by||'')}</td></tr>`}).join('')}</table>`:''})()}${(()=>{const ev=(h.events||[]).filter(e=>new Date(e.t).toDateString()===day.toDateString());return ev.length?`<h4>Eventos de cuidado</h4><p>${ev.map(e=>`${fhour(e.t)} ${esc(e.k)}`).join(' · ')}</p>`:''})()}

function docAlta(h){const p=pat(h.pid),a=h.alta;return`<div class="doc">${memb()}<h2>Hoja de alta hospitalaria</h2>${pdata(p,`<div><b>Ingreso:</b> ${fdate(h.ingreso,1)}</div><div><b>Alta:</b> ${fdate(a.date,1)}</div><div><b>Condición:</b> ${esc(a.cond)}</div>`)}<h4>Diagnóstico</h4><p>${esc(h.dx||h.motivo)}</p>${h.est?.st?`<h4>Estudios complementarios</h4><p>${esc(estText(h.est))}${h.est.res?'<br>'+nl(h.est.res):''}</p>`:''}<h4>Resumen clínico</h4><p>${nl(a.res)}</p>${a.ind?`<h4>Indicaciones en casa</h4><p>${nl(a.ind)}</p>`:''}${firmas(`Recibo a mi mascota y las indicaciones<br>${esc(p.prop)}`,mvzF())}</div>`}

function ac(inp,kind,arg){const ph=kind.startsWith('phr:');const sep=inp.dataset.sep||'.';const frag=ph?inp.value.slice(phrCut(inp.value,sep)+1):inp.value;const q=nrm(frag.trim());let it=ph?(PHR[kind.slice(4)]||[]).filter(x=>!nrm(inp.value).includes(nrm(x))||nrm(x).startsWith(q)&&q).map(v=>({v})):acItems(kind);if(q){const words=q.split(/\s+/);it=it.map(x=>{const n=nrm(x.v);if(!words.every(w=>n.includes(w)))return null;const sc=(n.startsWith(q)?0:n.split(/[\s(·/]+/).some(w=>w.startsWith(words[0]))?1:2);return{...x,sc}}).filter(Boolean).sort((a,b)=>a.sc-b.sc)}
